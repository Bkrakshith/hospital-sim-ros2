# g1_perception parameters (perception.launch.py). mode: gt = /sim/objects ground truth (sim only), onnx / mediapipe = real.
g1_perception_detector:
  ros__parameters:
    mode: gt                   # gt | onnx
    model: ""                  # onnx mode only: path to a YOLO-OBB ONNX export, else $G1_PERCEPTION_MODEL (no default)
    output_frame: map
    camera_frame: d435_link
    max_hz: 10.0
    conf: 0.35
    annotate: true
g1_perception_surgeon_hand:
  ros__parameters:
    mode: gt                   # gt | mediapipe
    output_frame: map
    max_hz: 10.0
