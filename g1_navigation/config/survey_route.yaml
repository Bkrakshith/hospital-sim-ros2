# Survey route: the G1 walks the whole ground floor of the Isaac hospital + the surgical wing while slam_toolbox
# maps it (scripts/survey_runner.py sends each waypoint to Nav2 as a NavigateToPose goal on the live SLAM map).
#
# Frame: `map` = sim world frame. The robot starts at the world origin facing +x (Isaac spawn "0,0,0"; the main
# lobby in front of the reception desk), so slam_toolbox's map frame (= odom at start) IS the world frame and the
# saved map lines up with g1_mission/config/locations.yaml and g1_teleop_manager/config/zones.yaml.
#
# Designed on a raster of the Isaac stage's static colliders (what the simulated lidar sees, 0.2-1.8 m) with
# A* between consecutive waypoints for a 0.35 m robot radius (g1-isaac-sim/tools/rasterize_colliders.py,
# scripts/plot_survey_route.py): every leg is collision-free, every planned leg stays >= 1.5 m from both staircases
# (Geo_M_Stairs* in the Isaac hospital; boxes below), and the route ends near the start (loop closure).
# Rooms behind closed doors / doorways narrower than ~0.8 m are not entered (the lidar sees what it can through
# them). yaw: omitted = face the next waypoint on arrival. area: shown in the video captions.
# Planned length (A* on the collider raster) ~530 m, 60 waypoints. Plot: maps/survey_route.png.
frame: map
start: {x: 0.0, y: 0.0, yaw: 0.0, note: 'Isaac spawn "0,0,0" = world origin, main
    lobby'}
stairs_keepout_m: 1.5
stairs:
- name: Geo_M_Stairs_873 + Stairs2 (central stair hall)
  box: [7.66, 11.0, 10.26, 15.0]
- name: Geo_M_Stairs4 + Stairs5 (north-west hall)
  box: [-32.44, 15.45, -29.84, 19.45]
waypoints:
  - {name: lobby_south_west, area: "Main lobby", x: -7.95, y: -1.35}   # leg 8.7 m
  - {name: hall_south_west, area: "Main lobby", x: -10.85, y: 3.45}   # leg 6.6 m
  - {name: hall_south_mid, area: "Central hall", x: -19.75, y: 3.95}   # leg 9.4 m
  - {name: west_hall, area: "West hall", x: -27.95, y: 5.05}   # leg 8.8 m
  - {name: west_hall_north, area: "West hall", x: -27.95, y: 9.55}   # leg 4.5 m
  - {name: nw_room_door, area: "West hall", x: -26.45, y: 13.05}   # leg 4.1 m
